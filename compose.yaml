services:
  agent:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AGENT_MODE: ${AGENT_MODE:-demo}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      NOTION_TOKEN: ${NOTION_TOKEN:-}
      NOTION_PARENT_PAGE_ID: ${NOTION_PARENT_PAGE_ID:-}
    volumes:
      - agent-data:/app/data
volumes:
  agent-data:
